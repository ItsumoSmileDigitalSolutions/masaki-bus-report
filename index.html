function b64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}

async function unlock(password){
  const enc = new TextEncoder();
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv   = b64ToBytes(PAYLOAD.iv);
  const data = b64ToBytes(PAYLOAD.data);
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password),
      {name:"PBKDF2"}, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:salt, iterations:PAYLOAD.iterations, hash:"SHA-256"},
      baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, data);
  return new TextDecoder().decode(plainBuf);
}

document.getElementById("gateForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  const pw  = document.getElementById("pw").value;
  err.textContent = "";
  btn.disabled = true; btn.textContent = "確認中...";
  try{
    const html = await unlock(pw);
    document.open();
    document.write(html);
    document.close();
  }catch(ex){
    err.textContent = "合言葉が違います。もう一度お試しください。";
    btn.disabled = false; btn.textContent = "レポートを開く";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
});
</script>
